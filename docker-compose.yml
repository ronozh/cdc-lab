# Mental model
#   Your Mac (host)
#    └─ Docker Desktop (a Linux VM)
#        ├─ container: cdc-postgres   (throwaway: can be deleted and recreated anytime)
#        │    └─ /var/lib/postgresql/data  ← Postgres writes its files here
#        │                 ▲ mounted
#        └─ volume: cdc-lab_pgdata    (persistent: lives on independently of the container)
#
#   The container is the process; the volume is the disk. Delete the container and the data stays.

services: # each entry = one container
  postgres: # service name; other containers reach it at hostname "postgres"
    image: postgres:17 # pinned major version; Debezium supports 17
    container_name: cdc-postgres # fixed name, shown in `docker ps`
    environment: # used only on first start (empty volume): creates user (superuser) + database
      POSTGRES_USER: ${PG_USER} # ${...} filled from .env
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports:
      - "5432:5432" # host:container. Mac localhost:5432 → container port 5432 (how the generator connects)
    volumes: # USE volumes: <volume or path>:<path inside container>
      - pgdata:/var/lib/postgresql/data # bare name = named volume (Docker-managed). "./pgdata:..." would be a bind mount (folder in this repo)
    command: ["postgres", "-c", "wal_level=logical"]
  kafka:
    image: apache/kafka:4.3.1 # official Apache image; KRaft mode (no ZooKeeper)
    container_name: cdc-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller # one node does both jobs: stores data + manages cluster metadata
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093 # ports it listens on inside the container
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092 # address it tells clients to use (service name on the Docker network)
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093 # the cluster's controllers: just this node
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # single broker → internal topics can only have 1 copy
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    # no ports: only containers talk to Kafka. No volume: data lives in the container (kept by stop/start, lost by down)

  connect:
    image: quay.io/debezium/connect:3.7 # Kafka Connect + Debezium connectors preinstalled
    container_name: cdc-connect
    depends_on: [kafka, postgres] # start order only (doesn't wait for "ready")
    ports:
      - "8083:8083" # REST API: how you manage connectors from the Mac
    environment:
      BOOTSTRAP_SERVERS: kafka:9092 # where Kafka is
      GROUP_ID: cdc-connect # Connect cluster id (workers with the same id share work)
      CONFIG_STORAGE_TOPIC: _connect_configs # Connect keeps its state in Kafka topics:
      OFFSET_STORAGE_TOPIC: _connect_offsets #   connector configs, source offsets (Debezium's WAL position),
      STATUS_STORAGE_TOPIC: _connect_status #   connector/task status
      CONNECT_CONFIG_PROVIDERS: env # allow ${env:VAR} in connector configs, so no secrets in JSON files
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      PG_USER: ${PG_USER} # passed in from .env, read by the connector via ${env:...}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}

volumes: # DECLARE named volumes (Docker creates them; real name gets the project prefix: cdc-lab_pgdata)
  pgdata: # empty = default options. Kept on `docker compose down`; deleted by `down -v`
